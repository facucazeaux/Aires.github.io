<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aires Neumáticos | Tres Arroyos</title>

    <!-- Meta descripción optimizada -->
    <meta name="description" content="Venta de neumáticos agrícolas y de vialidad en Tres Arroyos. Tractores, cosechadoras e implementos. Consultá nuestro catálogo online y stock." />
    
    <meta name="theme-color" content="#7eba3a" />

    <!-- Favicon e íconos limpios (con v=2 para forzar la actualización en el navegador) -->
    <link rel="icon" type="image/png" href="/img-neumaticos/logo.png?v=2" />
    <link rel="apple-touch-icon" href="/img-neumaticos/logo.png?v=2" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Fuentes de Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Script de redirección -->
    <script>
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
